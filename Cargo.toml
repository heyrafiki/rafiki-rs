[package]
name = "heyrafiki"
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.85"
description = "Async Rust client for the Heyrafiki API."
license = "Apache-2.0"
repository = "https://github.com/heyrafiki/rafiki-rs"
homepage = "https://heyrafiki.space"
documentation = "https://docs.heyrafiki.space/sdks"
readme = "README.md"
keywords = ["heyrafiki", "healthcare", "insurance", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
  "src/**",
  "examples/**",
  "tests/**",
  "openapi/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
fastrand = "2.3.0"
httpdate = "1.0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time"] }
url = "2.5.7"

[dev-dependencies]
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
